name: Create Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build web app
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Create gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.5

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Sign APK
        id: sign_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK not found, falling back to debug"
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag_name }}}"
          APK_NAME="TeamXD-Tools-${TAG}.apk"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
            apksigner sign --ks /tmp/keystore.jks \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "$APK_NAME" "$APK_PATH"
          else
            cp "$APK_PATH" "$APK_NAME"
          fi
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamxd-tools-apk
          path: ${{ steps.sign_apk.outputs.apk_name }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sign_apk.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.sign_apk.outputs.apk_name }}
          name: TeamXD Tools ${{ steps.sign_apk.outputs.tag }}
          body: |
            ## TeamXD Tools — Android APK Release

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" in your Android settings
            3. Open the APK file to install
            4. Launch "TeamXD Tools" from your app drawer

            ### What's New
            See generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
