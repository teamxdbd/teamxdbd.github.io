name: Create Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build web app
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --no-build-cache --max-workers=2 --stacktrace -x lint

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_DEST="TeamXD-Tools-${{ steps.tag.outputs.name }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_NAME=$APK_DEST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamxd-tools-apk
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ env.APK_NAME }}
          name: TeamXD Tools ${{ steps.tag.outputs.name }}
          body: |
            ## TeamXD Tools — Android APK Release

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" in your Android settings
            3. Open the APK file to install
            4. Launch "TeamXD Tools" from your app drawer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
